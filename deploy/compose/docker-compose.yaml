services:
  web:
    image: docker.io/digit4lsh4d0w/web-2025:1.0.0
    build:
      context: ../../
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DJANGO_POSTGRES_HOST: db
      DJANGO_POSTGRES_PORT: 5432
      DJANGO_POSTGRES_USER: fefu-lab
      DJANGO_POSTGRES_PASSWORD: E1i26ZFa4b5L8UdE
      DJANGO_POSTGRES_NAME: fefu-lab
      DJANGO_ALLOWED_HOST: localhost
      RUN_MIGRATIONS: true
    volumes:
      - static-volume:/var/www/fefu-lab/static/
    networks:
      - web-db
      - web-nginx
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: fefu-lab
      POSTGRES_USER: fefu-lab
      POSTGRES_PASSWORD: E1i26ZFa4b5L8UdE
    volumes:
      - postgres-volume:/var/lib/postgresql/
    networks:
      - web-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fefu-lab"]
      start_period: 3s
      interval: 2s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static-volume:/var/www/fefu-lab/static/:ro
    networks:
      - web-nginx
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      start_period: 3s
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  postgres-volume:
  static-volume:

networks:
  web-db:
  web-nginx:
